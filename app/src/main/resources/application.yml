spring:
  application:
    name: dodotalk-backend
    admin:
      enabled: true
  datasource:
    # ???? ??? ?? jdbc ?? r2dbc? ???? ?
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
    username: postgres.pykgjzoltroojlpnhpwi
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # DB connection? ???? ?? ex) connection pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20_000
      idle-timeout: 300_000
      max-lifetime: 12_000_000
      validation-timeout: 5_000
      pool-name: SpringBootHikariCP
      data-source-properties:
        prepareThreshold: 5
        prepareStatementCachedQueries: 256
        prepareStatementCachedSizeMiB: 5

        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_BASE64}
  expiration-minutes: 15